<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Полиця — інтернет-магазин техніки та товарів для дому</title>
  <meta name="description" content="Полиця — онлайн-гіпермаркет: смартфони, ноутбуки, телевізори, побутова техніка, взуття та парфумерія з офіційною гарантією. Доставка по всій Україні, розстрочка 0%.">
  <meta name="theme-color" content="#221f1f">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Полиця">
  <meta property="og:title" content="Полиця — інтернет-магазин техніки та товарів для дому">
  <meta property="og:description" content="Смартфони, ноутбуки, телевізори, побутова техніка та тисячі інших товарів. Доставка по всій Україні, розстрочка 0%.">
  <meta property="og:image" content="/img/banner/apple.jpg">
  <meta property="og:locale" content="uk_UA">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">Перейти до вмісту</a>
  <div class="demo-bar" role="note" hidden>Демонстраційна версія магазину: замовлення не доставляються й оплата не стягується, відгуки та статистика — приклади.</div>
  <header class="header"></header>
  <main id="app" tabindex="-1"></main>
  <footer class="footer"></footer>

  <nav class="tabbar" aria-label="Швидка навігація">
    <a class="tabbar__item" href="/" data-tab="home">
      <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-5.5h-5V20H4v-9.5Z"/></svg>
      <span>Головна</span></a>
    <button class="tabbar__item" type="button" data-tab="catalog" data-action="open-catalog-mobile">
      <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.2"/></svg>
      <span>Каталог</span></button>
    <button class="tabbar__item" type="button" data-tab="cart" data-action="open-cart" data-cart-target>
      <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2.2l2.1 10.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L21 8H6.1"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg>
      <span>Кошик</span><span class="count-badge count-badge--green" data-cart-count hidden></span></button>
    <a class="tabbar__item" href="/wishlist" data-tab="wishlist">
      <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 7.5 2.8C19.5 15.4 12 20 12 20Z"/></svg>
      <span>Обране</span><span class="count-badge" data-wish-count hidden></span></a>
    <button class="tabbar__item" type="button" data-tab="account" data-action="account">
      <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c.8-3.6 3.8-5.5 7.5-5.5s6.7 1.9 7.5 5.5"/></svg>
      <span>Кабінет</span></button>
  </nav>
  <noscript><p style="padding:24px;text-align:center">Для роботи магазину увімкніть JavaScript у браузері.</p></noscript>
</body>
</html>
